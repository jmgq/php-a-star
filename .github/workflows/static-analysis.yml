name: Static Analysis

on: [ push, pull_request ]

jobs:
  composer-validation:
    name: Composer Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6

      - name: Validate composer.json
        run: composer validate --strict

  coding-standards:
    name: Coding Standards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6

      - name: Install dependencies
        run: composer install --no-progress

      - name: Check coding standards
        run: composer coding-standards

  phan:
    name: Phan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php:
          - '8.0'
          - '8.1'
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6

      - name: Setup PHP and install dependencies
        uses: ./.github/actions/setup

      - name: Run Phan
        run: composer static-analysis:phan -- --no-progress-bar --target-php-version=${{ matrix.php }} --minimum-target-php-version=${{ matrix.php }}

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php:
          - '8.0'
          - '8.1'
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6

      - name: Setup PHP and install dependencies
        uses: ./.github/actions/setup

      - name: Run PHPStan
        run: composer static-analysis:phpstan -- --no-progress

  psalm:
    name: Psalm
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php:
          - '8.0'
          - '8.1'
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6

      - name: Setup PHP and install dependencies
        uses: ./.github/actions/setup

      - name: Select the configuration file
        id: cfg
        run: |-
          echo "config_file=${{ case(
            matrix.php == '8.0', 'psalm.xml',
            matrix.php == '8.1', 'psalm-php81.xml',
            matrix.php == '8.2', 'psalm-php81.xml',
            'psalm-php83.xml'
          ) }}" >> "$GITHUB_OUTPUT"

      - name: Run Psalm
        run: composer static-analysis:psalm -- --no-progress --php-version=${{ matrix.php }} --config=${{ steps.cfg.outputs.config_file }}
